<html lang="en">

    <title>Deal Configurator — Unofficial Partner Tools Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b5cff 0%, #0042e4 50%, #002db3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pw-box {
            background: #fff;
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
        }
        .pw-box h2 {
            margin-bottom: 0.5rem;
            color: #1a1a2e;
            font-size: 1.5rem;
        }
        .pw-box p {
            color: #666;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .pw-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .pw-box input:focus {
            border-color: #0b5cff;
        }
        .pw-box button {
            width: 100%;
            padding: 0.8rem;
            background: #0b5cff;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .pw-box button:hover {
            background: #0042e4;
        }
        .pw-error {
            color: #e53e3e;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
        .pw-back {
            display: inline-block;
            margin-top: 1.5rem;
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .pw-back:hover { color: #fff; }
    </style>
</head>

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        async function checkPassword() {
            const input = document.getElementById('pw-input').value;
            const hash = await sha256(input);
            if (hash === EXPECTED_HASH) {
                const decoded = atob(APP_DATA);
                document.open();
                document.write(decoded);
                document.close();
            } else {
                document.getElementById('pw-error').style.display = 'block';
                document.getElementById('pw-input').value = '';
                document.getElementById('pw-input').focus();
            }
        }
        
        document.getElementById('pw-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkPassword();
        });
        
        document.getElementById('pw-input').focus();
    </script>
