<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Zoom Partner Certification Tracker (Internal)</title><link rel="stylesheet" href="assets/app.css"></head>
<body><header><div class="logo"><b>zoom</b> Partner Certification Tracker</div><div class="sub">Internal · for CAMs, PSEs, and Zoomies</div></header>
<main id="app" class="wide">
  <div class="card login" id="login">
    <h2>Sign in</h2><p class="small">Use your Zoom email and the team passcode. Partners: use the status link from your Tech Hub channel.</p>
    <form id="f"><p><input id="em" type="email" placeholder="you@zoom.us" required></p>
    <p><input id="pw" type="password" placeholder="Team passcode" required></p>
    <button class="pri" type="submit">Open tracker</button> <span id="msg" class="err"></span></form>
  </div>
</main>
<script>window.CERT_INTERNAL = true;</script><script src="assets/render.js"></script><script src="assets/crypto.js"></script>
<script>
const KS = ["phone", "cx", "zva"], LBL = {phone: "Zoom Phone", cx: "Zoom CX", zva: "Zoom Virtual Agent"};
function stepCell(t) {
  const ph = stagePhrase(t);
  if (ph) return `<span class="badge ${ph.cls}" title="${esc(t.next)}">${esc(ph.txt)}</span>`;
  if (t.courses_taken) return `<span class="gray-note" title="${esc(t.next)}">${t.courses_taken} course${t.courses_taken === 1 ? "" : "s"} taken · not applied</span>`;
  return `<span class="gray-note">—</span>`;
}
function lastProgress(p) {
  const ds = KS.map(k => p.tracks[k].last_progress).filter(Boolean).sort();
  return ds.length ? ds[ds.length - 1] : null;
}
function stalledCell(p) {
  const d = lastProgress(p);
  if (!d) return `<span class="gray-note">No activity</span>`;
  const n = daysAgo(d);
  if (n > 365) return `<span class="gray-note" title="Last course completion or application: ${esc(fmtDate(d))}">1y+</span>`;
  return `<span class="${n > 30 && KS.some(k => p.tracks[k].pursuing) ? "stale" : ""}" title="Last course completion or application: ${esc(fmtDate(d))}">${n}d</span>`;
}
function overview(data) {
  const app = document.getElementById("app");
  const P = data.partners;
  const cams = [...new Set(P.map(p => p.cam).filter(Boolean))].sort();
  const count = f => P.filter(p => KS.some(k => f(p.tracks[k]))).length;
  app.innerHTML = `${data.drift.length ? `<div class="drift">⚠️ Program guide change detected: ${data.drift.map(esc).join(" ")}</div>` : ""}
  ${(data.changes && data.changes.changes && data.changes.changes.length) ? `<div class="card" style="background:#F8FAFF;border-color:#D6E2FF"><b>Changes in the ${esc(data.changes.date)} refresh</b><ul style="margin:8px 0 0">${data.changes.changes.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div>` : ""}
  <div class="kpis">
    <div class="kpi"><b>${P.length}</b><span>Engaged partners</span></div>
    <div class="kpi"><b>${count(t => t.step === 2)}</b><span>Applied for a competency</span></div>
    <div class="kpi"><b>${count(t => t.step === 3)}</b><span>Competency ✓, not yet certified</span></div>
    <div class="kpi"><b>${count(t => t.step === 4)}</b><span>Deployment Certified 🏆</span></div>
  </div>
  <div class="card" id="listcard">
    <div class="filters">
      <input id="q" placeholder="Search partners…">
      <select id="fc"><option value="">All CAMs</option>${cams.map(c => `<option>${esc(c)}</option>`).join("")}</select>
      <select id="ft"><option value="">All tracks</option>${KS.map(k => `<option value="${k}">${LBL[k]}</option>`).join("")}</select>
      <select id="fs"><option value="">Any stage</option><option value="p">Pursuing (applied or further)</option><option value="1">Courses only · not applied</option><option value="2">Applied for competency</option><option value="3">Competency ✓ · not certified</option><option value="4">Deployment Certified</option><option value="s">Stalled 30+ days</option></select>
    </div>
    <div class="key"><span><span class="gray-note">Gray text</span> = courses taken, no application (not pursuing yet)</span><span><span class="badge b-active">Blue</span> = applied, pursuing</span><span><span class="badge b-done">Green 🏆</span> = Deployment Certified only</span><span><span class="stale">Orange days</span> = pursuing, no progress in 30+ days</span></div>
    <div class="small" style="margin-bottom:8px">Data as of ${esc(data.updated)}. Click a row for full detail. Hover a status to see the partner's next step.</div>
    <div style="overflow-x:auto"><table class="list"><thead><tr>
      <th data-s="name">Partner ↕</th><th data-s="cam">CAM ↕</th>${KS.map(k => `<th data-s="${k}">${LBL[k]} ↕</th>`).join("")}<th data-s="last">Last progress ↕</th><th>Partner link</th></tr></thead><tbody id="tb"></tbody></table></div>
  </div><div id="detail"></div>`;
  let sortKey = "name", dir = 1;
  const draw = () => {
    const q = document.getElementById("q").value.toLowerCase(), fc = document.getElementById("fc").value,
          ft = document.getElementById("ft").value, fs = document.getElementById("fs").value;
    let rows = P.map((p, i) => ({p, i})).filter(({p}) => (!q || p.partner.toLowerCase().includes(q)) && (!fc || p.cam === fc)
      && (!fs || (ft ? [ft] : KS).some(k => {
        const t = p.tracks[k];
        if (fs === "p") return t.pursuing;
        if (fs === "s") return t.pursuing && daysAgo(lastProgress(p)) > 30;
        if (fs === "1") return !t.pursuing && t.courses_taken > 0;
        return t.step === +fs;
      })));
    const val = (p) => sortKey === "name" ? p.partner.toLowerCase() : sortKey === "cam" ? (p.cam || "~").toLowerCase() : sortKey === "last" ? daysAgo(lastProgress(p)) : -((p.tracks[sortKey].pursuing ? 100 : 0) + p.tracks[sortKey].step * 10 + (p.tracks[sortKey].courses_taken || 0));
    rows.sort((a, b) => (val(a.p) > val(b.p) ? 1 : val(a.p) < val(b.p) ? -1 : 0) * dir);
    document.getElementById("tb").innerHTML = rows.map(({p, i}) => `<tr data-i="${i}"><td><b>${esc(p.partner)}</b>${p.confirm_roster ? ' <span class="badge b-todo" title="Not in the roster. Name and Salesforce match were guessed.">Confirm in roster</span>' : ""}${p.added ? ` <span class="badge b-active" title="${esc((p.reasons || []).join("; "))}">New</span>` : ""}<div class="small">${esc((p.reasons || []).join(" · "))}</div>${(p.focus || []).length ? ` <span class="badge b-focus">${p.focus.map(k => LBL[k]).join(", ")}</span>` : ""}</td>
      <td>${p.cam ? esc(p.cam) + (p.cam_source === "tech_hub" ? '<span class="camsrc" title="Inferred from Tech Hub membership. Add to your roster to confirm.">from Tech Hub</span>' : p.cam_source === "asana" ? '<span class="camsrc" title="From the Asana competency application">from Asana</span>' : "") : '<span class="gray-note">No CAM</span>'}</td>${KS.map(k => `<td style="${ft && ft !== k ? "opacity:.35" : ""}">${stepCell(p.tracks[k])}</td>`).join("")}
      <td>${stalledCell(p)}</td><td><button class="ghost cp" data-t="${esc(p.token)}">Copy link</button></td></tr>`).join("") || `<tr><td colspan="7" class="small">No partners match.</td></tr>`;
    document.querySelectorAll("#tb tr[data-i]").forEach(tr => tr.addEventListener("click", e => { if (!e.target.closest(".cp")) openP(+tr.dataset.i); }));
    document.querySelectorAll(".cp").forEach(b => b.addEventListener("click", () => { navigator.clipboard.writeText(new URL("status.html?p=" + b.dataset.t, location.href).href); b.textContent = "Copied ✓"; }));
  };
  const openP = i => {
    const p = P[i], d = document.getElementById("detail");
    document.getElementById("listcard").style.display = "none";
    document.querySelector(".kpis").style.display = "none";
    const extra = `<p class="small" style="margin-top:10px">Salesforce accounts merged: ${p.accounts.map(a => `${esc(a.name)} (${esc(a.id)})`).join(" · ")}${p.tech_hub ? ` · Tech Hub: ${esc(p.tech_hub)}` : ""}</p>`;
    d.innerHTML = `<div class="back"><button class="ghost" id="bk">← All partners</button></div><div id="pv"></div>`;
    renderPartner(document.getElementById("pv"), p, extra);
    document.getElementById("bk").addEventListener("click", () => { d.innerHTML = ""; document.getElementById("listcard").style.display = ""; document.querySelector(".kpis").style.display = ""; });
    window.scrollTo({top: 0, behavior: "smooth"});
  };
  document.querySelectorAll("th[data-s]").forEach(th => th.addEventListener("click", () => { dir = sortKey === th.dataset.s ? -dir : 1; sortKey = th.dataset.s; draw(); }));
  ["q", "fc", "ft", "fs"].forEach(id => document.getElementById(id).addEventListener("input", draw));
  draw();
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = document.getElementById("msg"), em = document.getElementById("em").value.trim().toLowerCase();
  if (!/@zoom\.(us|com)$/.test(em)) { msg.textContent = "Use your Zoom email."; return; }
  try {
    const blob = await (await fetch("data/internal.enc", {cache: "no-store"})).json();
    overview(await decrypt(blob, document.getElementById("pw").value));
  } catch (err) { msg.textContent = "Wrong passcode."; }
});
</script></body></html>
